<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/style/style.css">
    <link rel="stylesheet" href="./assets/style/game.css">
    <link rel="icon" href="./assets/img/logo.png">
    <!-- It is a Awasome Font Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="./assets/script/confetti.js"></script>
    <title>Tic Tac Toe Game</title>
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-spinner"></div>
        <h3>Loading</h3>
    </div>
    <div id="confetti-container"></div>
    <div class="game-box">
        <div id="input">
            <input type="name" placeholder="Enter Your Name" maxlength="10">
            <button onclick="join()">JOIN</button>
        </div>
    </div>
    <script src="./assets/script/winner.js"></script>
    <script src="./assets/script/client.js"></script>
    <script src="./assets/script/multiplayer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.body.classList.add("loaded");
        });
        this.blocks = ['', '', '', '', '', '', '', '', ''];
        function loadLevel(evt) {
            const computer = new ComputerGame(evt.value);
            document.querySelector('.level').style.display = 'none';
            document.querySelector('.game-box').style.display = 'flex';
        }
        const client = new Client();
        const multiplayer = new MultiPlayer();
        function join() {
            const name = document.querySelector('#input input').value.trim();
            if (!name) {
                alert('Enter Your Name');
                return;
            }

            // Show "Waiting for Match" UI immediately using your multiplayer class
            multiplayer.waiting();

            client.JoinUser(name); // Triggers multiplayer request to server

            // Optional timeout after 15s
            setTimeout(() => {
                if (!multiplayer.started) {
                    multiplayer.panel.innerHTML = "<h2>Server not responding. Try again later.</h2>";
                }
            }, 15000);
        }

    </script>
</body>

</html>
